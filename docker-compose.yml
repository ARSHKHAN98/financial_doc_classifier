version: '3.8'

services:
  # Document Processing API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc-processor-api
    ports:
      - "8000:8000"
    environment:
      # Application settings
      - APP_NAME=Document Processing Service
      - ENVIRONMENT=production
      - DEBUG=false
      
      # Security (CHANGE IN PRODUCTION!)
      - API_KEYS=prod-key-abc123,prod-key-def456
      
      # Rate limiting
      - RATE_LIMIT_REQUESTS=60
      - RATE_LIMIT_WINDOW=60
      
      # File upload
      - MAX_FILE_SIZE_MB=10
      
      # Logging
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      
      # Timeouts
      - JOB_TIMEOUT_SECONDS=120
      - MODEL_TIMEOUT_SECONDS=30
    volumes:
      # Mount model directory
      - ./models:/app/models:ro
      # Optional: Mount custom config
      # - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - doc-processor-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Prometheus for metrics (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: doc-processor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - doc-processor-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: doc-processor-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - doc-processor-network
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  doc-processor-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
